# =============================================================================
# patch-swift (PatchSDK) — CI: build + test on every push / PR
# =============================================================================
# PatchSDK is a SwiftPM package (swift-tools-version:6.0) built with the Apple
# toolchain on a macOS runner. No WebAssembly SDK is needed: the runtime tests
# instantiate and run committed .wasm fixtures (under Tests/PatchSDKTests/
# Fixtures/) via WasmKit (pure Swift). The one test that needs the large
# regenerable NetworkingGuest.wasm self-skips with XCTSkip when that fixture is
# absent (it is intentionally not committed).
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (swift)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-14 defaults to Xcode 15 / Swift 5.10; the package declares
      # swift-tools-version:6.0, so select an Xcode 16 (Swift 6) toolchain.
      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift toolchain
        run: swift --version

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

      # iOS build gate: `swift test` runs on macOS, where the UIKit/StoreKit host
      # bridges are #if canImport(UIKit)-gated out. Build every scheme for the iOS
      # Simulator so iOS-only Swift 6 concurrency / SwiftUI errors fail CI.
      - name: xcodebuild (iOS Simulator)
        run: |
          for scheme in PatchSDK PatchSwiftUI PatchRender PatchViewIR; do
            echo "=== Building $scheme for iOS Simulator ==="
            xcodebuild build \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          done

  # Android gate: cross-compile the package with the official Swift SDK for
  # Android and run PatchSDKTests on an Android emulator. Apple-only bridges and
  # renderers are #if canImport-gated out there, so this job guards the
  # platform-neutral core (WasmKit runtime, loader, Brotli/BSDIFF40, SHA-256,
  # update lifecycle) against regressions that only show up off Apple
  # platforms. The action copies the test resource bundle (.wasm fixtures) to
  # the emulator. Locally: `skip android test`.
  android:
    name: build + test (android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + test on Android emulator
        uses: skiptools/swift-android-action@v2
        with:
          # Pinned to the toolchain the Android port was verified with. Must be
          # the full release name: "6.4" resolves to a non-existent download.
          swift-version: "6.4.0"
          # Ubuntu runners can run out of disk while installing the emulator.
          free-disk-space: true
          # Swift 6.4 (swift-build backend) names the test resource bundle
          # `PatchSDK_PatchSDKTests.bundle`, but the action only copies
          # `*.resources` to the emulator, so Bundle.module fatal-errors. Copy the
          # .bundle too. `${BUILD_DIR}` is the action's own build-products
          # variable: this value is pasted into its shell script verbatim.
          copy-files: ${BUILD_DIR}/*.bundle
